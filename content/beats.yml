# -----------------------------------------------------------------------------
# 首頁「這幾年」的五段文案。
#
# 每一段的事件清單不寫在這裡：它依 from / to 的日期範圍，直接從 timeline.yml
# 算出來。年表改了，這裡跟著改，兩邊不會對不上。這個檔只放你要說的話。
#
# 語氣：第一人稱。標題一律是問句，事件清單就是答案。
# 不寫形容詞，不替自己下結論。lede 留空就不渲染。
# 英文版在 en.yml 的 beats，用 id 對應。
# -----------------------------------------------------------------------------

- id: ignite
  from: 2022-09
  to: 2023-10
  title: 我怎麼讓別人願意讓我動手？
  lede: >-
    大一的時候我什麼都不會，也沒有人會把事情交給這樣的人。
    所以我先做沒人想做的：修系上的電腦、重整卡到不能看的網站、
    把各玩各的社群串起來。做完之後，開始有人問我要不要一起做點什麼。

- id: build
  from: 2024-03
  to: 2024-07
  title: 我能不能同時做兩件難的事？
  lede: >-
    2024 年三月我修了畢業專題，拿它去申請國科會大專生計畫；四月接下斐闊的技術長。
    一邊要交研究成果，一邊要出貨，哪個都不能拖。那一季我學到最多的是取捨。

- id: peak
  from: 2024-10
  to: 2024-12
  title: 帶 30 個人與寫 30 行 code，哪個難？
  lede: >-
    同一個十一月，我交了三件競賽作品，也把帶了一年兩個月、四組共 30 人的平台交接出去。
    寫程式有編譯器告訴你錯在哪，帶人沒有。

- id: proof
  from: 2025-01
  to: 2025-12
  title: 把自己的產品推翻重做，需要什麼？
  lede: >-
    2025 年五月，我們承認發票醫生已經改到自己看不出問題，再測下去也不值得，
    於是從頭做了財伴。同一年公司完成登記、台積電黑客松拿下第一、
    兩份國科會研究結案，我也進了工研院。

- id: now
  from: 2026-01
  to: 2026-12
  title: 畢業了，然後呢？
  lede: >-
    2026 年六月拿到學士和兩個學分學程，九月直升碩士班。
    兩間公司的技術端都還在我手上；十一月多了一座黑客松佳作，還有兩個開源專案。
