# -----------------------------------------------------------------------------
# 首頁那部片的五幕文案。
#
# 每一幕的「事件清單」不寫在這裡 —— 它直接從 timeline.yml 依日期範圍算出來，
# 所以年表改了，片子跟著改，兩邊不可能對不上。這個檔只放**你要說的話**。
#
# 語氣：第一人稱、有態度。標題一律是問句 —— 那一幕的事件清單就是答案。
# 不寫形容詞，不寫「熱愛」「致力於」，不替自己下結論。
#
# title  一行問句。會用襯線大字排。
# hud    HUD 狀態列用的短標籤 —— 那一行只有一行的寬度，塞不下一個問句。
# lede   一到兩句。留空就不會渲染 —— 空白比灌水誠實。
# note   選填。一行小字，放在事件清單下面。
#
# 幕的時間範圍定義在 composables/useFilm.ts 的 BEATS，不在這裡改。
# -----------------------------------------------------------------------------

- id: ignite
  hud: 起點
  title: 我怎麼讓別人願意讓我動手？
  lede: >-
    大一的時候我什麼都不會，而沒有人會把事情交給一個什麼都不會的人。
    所以我先去做那些沒人想做的：修系上的電腦、重整卡到不能看的網站、
    把各玩各的社群串起來。做完之後，才開始有人問我要不要一起做點什麼。
  note: null

- id: build
  hud: 建造
  title: 我能不能同時做兩件難的事？
  lede: >-
    2024 年三月我先修了畢業專題，四月接下斐闊的技術長。一個要寫論文、一個要出貨，
    兩個都不能拖。那一季我學會的不是技術，是取捨。
  note: null

- id: peak
  hud: 三個月
  title: 帶 30 個人與寫 30 行 code，哪個難？
  lede: >-
    同一個十一月，我交了三件競賽作品，也把帶了一年兩個月、四組共 30 人的
    平台交了出去。寫程式有編譯器告訴你錯在哪；帶人沒有。
  note: null

- id: proof
  hud: 2025
  title: 把自己的產品推翻重做，需要什麼？
  lede: >-
    2025 年五月我們承認發票醫生已經到了自己看不出問題的階段。
    不是它不能用，是它不值得再測下去。同一年公司登記、台積電黑客松拿下第一、
    兩份國科會研究結案、進了工研院。
  note: 全片唯一一次四條軌同時亮。

- id: now
  hud: 現在
  title: 畢業了，然後呢？
  lede: >-
    這裡沒有結尾。學士拿到了，碩士開始了，兩間公司的技術端都還在手上，
    四條線一條都沒停。你現在看到的是進行式，不是完成式。
  note: null
