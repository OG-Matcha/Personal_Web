turn:
  title: 讓系統活得比寫它的人久
  text: >-
    一個沒有投資人、所有人都還在念書、每個人隨時可能離開的團隊，
    寫程式之前要先問「下一個人接得住嗎」。所以四條產品線用同一套技術，
    換人的時候，不會有人帶走一整條產品線。

myPart:
  - 從組隊開始擔任技術長，帶 4 人以下的工程團隊
  - 統一四條產品線的技術，讓人員交接接得住
  - 主導財伴 oSave 的系統架構與後端

