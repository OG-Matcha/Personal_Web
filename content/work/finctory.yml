tagline: 讓每一分錢都活得有意義的金融科技新創。
summary: >-
  2024 年四月，幾個還在念書的人組了隊；兩年後，它是一間登記在案的公司，
  有四條產品線：財伴 oSave、找好康 SurPrice、淘換算和財伴 Podcast。
  我是共同創辦人兼技術長。

