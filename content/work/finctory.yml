summary: >-
  我在這裡學會的不是怎麼寫系統，是怎麼讓系統活得比寫它的人久。一個沒有投資人、
  所有人還在唸書、每個人隨時可以走的組織，技術決策的第一個約束是交接。

problem: >-
  2024 年四月組隊的時候，我原本以為技術長的工作是把技術做對。後來發現不是——
  兩年後這是一間登記在案的公司、四條產品線、四個領導職位，
  而當初那批夥伴幾乎全部換過一輪。

  真正的問題是：一個沒有投資人、所有人都還在唸書、每個人隨時可以走的組織，
  要怎麼讓技術決策撐得過人員流動？我做的每一個選擇，第一個要通過的檢查
  不是「這樣寫最好嗎」，是「下一個人接得住嗎」。

decisions:
  - decision: 技術選型全部收斂到同一套 stack，不讓每個產品各自挑喜歡的工具。
    rejected: 每條產品線用最適合自己的技術
    why: >-
      四條產品線、四個人以下的工程團隊。如果 oSave 用 FastAPI、SurPrice 用 Node、
      淘換算用別的，那任何一個人離開都會帶走一整條產品線的維護能力。
      統一 stack 買到的不是效能，是「換人接手」這件事本身。
    cost: 有些產品用了不是最適合它的工具，PWA 那條尤其明顯。
    date: 2024-04

  - decision: 產品線擴張，而不是把所有資源壓在旗艦產品上。
    rejected: 集中火力做 oSave

