highlights:
  - title: 價格旁邊，直接是台幣
    text: 商品頁、搜尋結果、購物車、收藏和足跡頁上，每個人民幣價格旁邊都會多一個台幣標籤。往下捲、換頁、篩選，新載入的價格也會跟著換算。
  - title: 匯率每天自己更新
    text: 點右上角的圖示，看得到現在用的匯率和最後更新的時間。不用自己輸入匯率，也不用設定。
    shot: /images/taobao-popup.webp
  - title: 不用登入，也不碰你的資料
    text: 所有換算都在你自己的瀏覽器裡完成，不需要帳號，不讀也不存你的購物紀錄；結帳和登入頁面它根本不會出現。

myPart:
  - 一個人從零做到上架：價格偵測、匯率更新、彈出視窗和歡迎頁
  - 讓淘寶不斷變動的頁面（捲動載入、單頁切換）上的價格都換算得到
  - 送審、上架 Chrome 線上應用程式商店，之後持續維護

