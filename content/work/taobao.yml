tagline: 逛淘寶，價格旁邊直接出現台幣。
summary: >-
  在淘寶和天貓買東西，每看到一個人民幣價格就得自己乘一次匯率。
  裝了淘換算，商品頁、搜尋結果和購物車上的價格旁邊會直接標出新台幣，匯率每天自己更新。

