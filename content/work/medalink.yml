tagline: 診所的 AI 櫃檯：回訊息、排時段、追回診，一套做完。
summary: >-
  LINE、FB、IG 和官網的私訊進同一個收件匣，AI 照診所自己的規則回答，
  再把人帶進醫師、診間、儀器都空得出來的時段；約完之後的提醒、改約、
  術後衛教和半年回診也一起接手。

outcomes:
  - value: 2 人
    label: 從需求做到上線
  - value: 4 個通路
    label: 私訊進同一個收件匣

highlights:
  - title: 排得出來的時段，才會給客人選
    text: 一個療程拆成好幾段，每段要用的醫師、助理、診間、儀器都空著，才會出現在選項裡。櫃檯不用再打電話去改排錯的約。
    shot: /images/medalink-1.jpg
  - title: 每個客人走到哪一步，一眼看得到
    text: 約好就自動建檔，用七段流程追蹤狀態；前一天提醒、改約、候補遞補、術後衛教、半年回診召回，每一項都能單獨開關。
    shot: /images/medalink-2.jpg
  - title: 不能講的話，AI 不會講
    text: 療效保證、比較性用語、術後症狀判斷都在禁答清單裡，AI 碰到就停手並通知櫃檯；傷口、醫療影像這類照片一律轉給真人。
    shot: /images/medalink-3.jpg

turn:
  title: 不只是自動回訊息
  text: >-
    櫃檯一個月能接訊息的時間大約 176 小時，剩下的 544 小時訊息還是一直進來。
    但只做自動回覆不夠：問題答完之後，要把人帶進一個真的排得出來的時段，
    約完之後還有提醒、改約和回診。MedaLink 把這一整段都接起來。

myPart:
  - 兩人團隊裡負責 AI 的那一半，從對話引擎一路做到雲端部署
  - 讓 AI 照每家診所自己的劇本、知識庫和禁答清單回答，語氣學診所自己的對話
  - 依訊息難度分流到不同模型，簡單的招呼用便宜的模型，省下診所的費用

stack:
  client: [React 18, Vite 6, GSAP, Recharts]
  edge-api: [Cloudflare Pages Functions, jose]
  agents: [LLM Multi-Agent]
  data: [Cloudflare D1, Cloudflare R2]
  infra: [Cloudflare Pages, Cloudflare Workers Cron, Browser Rendering, Wrangler]
