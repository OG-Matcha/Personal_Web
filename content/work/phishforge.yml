tagline: 讓 AI 寫出你分不出真假的釣魚信，資安演練才有用。
summary: >-
  範本式的演練信用過幾次，員工就認得了，學會的是辨識公司寄的信，不是辨識釣魚。
  PhishForge 依部門和近期情境讓 AI 寫出客製的釣魚信和仿冒登入頁，
  再告訴企業有多少人開信、點連結、填了表單。

outcomes:
  - value: 第一名
    label: 大專校院資訊應用服務創新競賽 資安應用組
  - value: 不留密碼
    label: 只記錄行為，不存受測者輸入的內容

demo: phish

highlights:
  - title: 幾步就能開一場演練
    text: 輸入公司名稱、部門結構和近期情境就能開始，不需要員工的真實個資。
    shot: /images/phishforge-2.png
  - title: AI 寫信，你來把關
    text: AI 依情境寫出客製化的信件內容和寄件人樣態，生成的內容會再過一層規則檢查，不產出能直接拿去真實攻擊的素材。
    shot: /images/phishforge-3.png
  - title: 只看行為，不留密碼
    text: 只記錄開信、點擊、送出表單和花了多久，受測者打了什麼一律不存。每場演練跑在獨立的容器裡，結束就銷毀。

myPart:
  - 後端與 AI 工程：用 FastAPI 寫後端，PostgreSQL 與 Redis 存資料和即時統計
  - 用 LangChain 串 Gemini，生成客製化的釣魚信和對應的仿冒登入頁
  - 把每場演練部署成獨立的 AWS ECS 任務，演練結束就銷毀

stack:
  client: [Vue.js]
  edge-api: [FastAPI]
  agents: [LangChain, Gemini API]
  data: [PostgreSQL, Redis]
  infra: [Docker, AWS ECS]
