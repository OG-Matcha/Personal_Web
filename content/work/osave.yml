# -----------------------------------------------------------------------------
# 案例研究：財伴 oSave（前身：發票醫生）
#
# 這一份是照 oSave 行動版與後端的實際程式碼重寫的。
# 舊版寫成「串接電子發票載具的 Nuxt 網站」，那是 pivot 前的發票醫生，不是財伴。
# -----------------------------------------------------------------------------

slug: osave
tier: promoted
order: 1

title: 財伴 oSave
titleEn: oSave
formerName: 發票醫生
role: 技術長 · 系統架構與後端
org: 斐闊 Finctory
orgUrl: https://www.finctory.com/
period: { start: 2025-05, end: null } # 2025-05 pivot 定案；發票醫生自 2024-07 起
pivotedAt: 2025-05
status: 已上線
# 上架連結。App Store 的網址省略了中文 slug —— Apple 只用結尾的數字 ID 解析，
# slug 只是給人看的，而 percent-encoded 的中文會讓這一行長到看不出是什麼。
links:
  - label: 官網
    labelEn: Official site
    href: https://www.finctory.com/products/osave/
  - label: App Store
    href: https://apps.apple.com/tw/app/id6773630700
  - label: Google Play
    href: https://play.google.com/store/apps/details?id=com.finctory.osave

cover: /images/osave-1.webp
thumbnail: /images/osave-1.webp
# Phone frames, not wide captures - the page lays them out three across
# instead of two, and reserves the right box so they do not jump on load.
screenshotShape: phone
screenshots:
  - /images/osave-2.webp # 首頁：今日餘額、本周支出、異常支出
  - /images/osave-3.webp # 月度分析：收支比較、金流走向、支出情況
  - /images/osave-4.webp # 收支趨勢評分與建議
# pivot 前的發票醫生。留著是因為 pivot 本身就是這個案例的主線之一。
formerScreenshots:
  - /images/invoicedoctor-1.jpg
  - /images/invoicedoctor-2.png
  - /images/invoicedoctor-3.png

# 作品頁是給使用者和訪客看的產品介紹：講它能幫你做什麼，不講內部決策和程式行數。
# （原本的架構決策、資料流、程式規模寫在 git 歷史裡。）

tagline: 回答「我的財務到底健不健康」的記帳 App。
summary: >-
  大部分記帳 App 只告訴你錢花去哪；財伴用會計的方式記帳，幫你算出六項財務健康指標，
  每個月給一個分數，也說得出是哪裡拉低了分數。

# 對使用者有意義的成果。總覽頁取前兩項。
outcomes:
  - value: iOS ＋ Android
    label: 雙平台上架
  - value: '{awards} 項'
    label: 競賽得獎
  - value: '{topPrizes} 項'
    label: 拿下首獎
  - value: U-Start
    label: 教育部創業補助

highlights:
  - title: 記一筆，只要三下
    text: 選錢是進來還是出去、用什麼付，再打品項和金額；類別會自己填好。不用懂會計，記下來的每一筆卻都帶著會計上的意義。
    shot: /images/osave-2.webp
  - title: 一頁看懂這個月
    text: 收支比較、金流走向、支出比例攤在同一頁，錢從哪裡來、流到哪裡去，一眼就看得出來。
    shot: /images/osave-3.webp
  - title: 給你分數，也告訴你為什麼
    text: 六項指標換算成 0–100 分，列出需要改善和值得保持的地方，再用一句話說下個月可以怎麼調整。
    shot: /images/osave-4.webp

turn:
  title: 從發票醫生到財伴
  text: >-
    第一版叫「發票醫生」，會自動讀發票、整理你的消費。資料都有了，使用者看完卻還是回答不了
    「我這個月是變好還是變壞」。2025 年 5 月我們決定改方向：與其自動抓更多資料，
    不如讓每一筆紀錄都能算出結論。
  image: /images/invoicedoctor-1.jpg

myPart:
  - 以技術長身分帶開發團隊，從發票醫生一路做到財伴上架
  - 設計整套系統架構，寫後端與財務指標的計算
  - 做品項自動分類：先查規則，查不到才問 AI，分類失敗也不擋記帳

stack:
  client: [Flutter, Dart, BLoC, GoRouter, GetIt, Drift]
  edge-api: [Firebase Cloud Functions, Python]
  ai: [LLM]
  data: [Cloud Firestore, Cloud Storage]
  infra: [Firebase Auth, Cloud Messaging, Remote Config, Crashlytics, Codemagic]
