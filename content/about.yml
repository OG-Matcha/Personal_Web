# -----------------------------------------------------------------------------
# 電影結束之後那一塊。片子講完四年，這裡回答「所以他現在到底在幹嘛」。
#
# 規則：第一人稱，不寫形容詞，不寫「熱愛」「致力於」。
# 每個數字都要在 timeline.yml、work/*.yml 或程式碼裡驗得了。
# -----------------------------------------------------------------------------

# 主標。首屏最大的一句話，動詞開頭。
thesis: 把 AI 從展示品，做到能上線維運
# 接住主標的反問。把「上線維運」為什麼難講白。
thesisSub: Demo 很好做。難的是三個月後還有人在用。

# 一段導語。不要在這裡重複下面的數字 —— 那是同一件事講兩次。
lede: >-
  四人以下的團隊沒有第二個人可以接手。這個約束逼出了我大部分的技術判斷——
  另一間公司，連第一個人都只有我。

# ---- 三個地方，三種角色 ------------------------------------------------------
# 這一塊取代了原本的「三條原則」。原則是信念，這個是證據。
#
# 三個地方同時在跑，而且角色型態完全不同：帶團隊、一個人到底、進大組織。
# 這是履歷上看不出來、但一並排就很清楚的事。
postsHeading: 三個地方，三種角色
