# -----------------------------------------------------------------------------
# 能力斷面。
#
# 這份檔案取代了舊網站的三套技能系統（六邊形圖、百分比長條圖、標籤雲），
# 那三套彼此矛盾，而且用自評百分比當量尺 —— 技術讀者八秒就看得出來。
#
# 這裡的量尺不是「熟練度」，是「證據層級」：
#   shipped-prod         有人在用的東西裡跑著
#   shipped-competition  出貨過並在競賽/評審面前跑過
#   research-prototype   研究計畫的原型
#   studied              學過、練過，還沒交付過
#
# 硬規則：evidence 為 null 的節點不會被渲染。這條規則會印在頁面上給讀者看，
#        所以它同時是資料合約，也是可信度的來源。
# -----------------------------------------------------------------------------

tiers:
  - id: shipped-prod
    label: 生產環境
    rank: 4
  - id: shipped-competition
    label: 競賽出貨
    rank: 3
  - id: research-prototype
    label: 研究原型
    rank: 2
  - id: studied
    label: 學習紀錄
    rank: 1

nodes:
