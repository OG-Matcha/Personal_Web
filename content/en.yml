thesisLines:
  - Taking AI from demo
  - to something that runs.
thesisSub: Demos are easy. The hard part is that someone is still using it three months later.
intro: Ju-Shen Huang (黃鉅燊, OG_Matcha online), from Taoyuan, Taiwan. Co-founder and CTO of Finctory, co-founder and forward-deployed engineer at MedaLink. BS in Information Management from National Central University (2026), now in the same department's master's program.
lede: In a team of four or fewer there is no second person to hand anything to. That constraint made most of my technical decisions. At the other company, there is not even a first person besides me.
portraitAlt: Photo of Ju-Shen Huang
caption: Four-colour separation, screen angles 15° / 75° / 0° / 45°. The cursor is a loupe.

