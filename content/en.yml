beats:
  ignite:
    title: How do you get people to let you do the work?
    lede: In my first year I knew nothing, and nobody hands work to someone like that. So I took the jobs nobody wanted – fixing the department’s computers, rebuilding a website too slow to use, joining up student groups that never talked. After that, people started asking whether I wanted to build something with them.
  build:
    title: Can I do two hard things at once?
    lede: In March 2024 I started my capstone project and used it to apply for an NSTC undergraduate research grant; in April I became CTO of Finctory. One side owed research results, the other owed releases, and neither could slip. That quarter taught me trade-offs more than anything else.
  peak:
    title: Leading 30 people or writing 30 lines of code – which is harder?
    lede: In the same November I submitted three competition entries and handed over a platform I had run for fourteen months, four teams and 30 people. Code has a compiler to tell you where it broke. People do not.
  proof:
    title: What does it take to tear down your own product?
    lede: In May 2025 we admitted Invoice Doctor had reached the point where we could no longer see its problems, and that testing it further was not worth it, so we started oSave from scratch. The same year the company was registered, we won the TSMC hackathon, two NSTC projects closed, and I joined ITRI.
  now:
    title: Graduated. Now what?
    lede: In June 2026 I finished my bachelor’s degree with two credit programs, and in September I moved straight into the master’s program. I still run the technical side of both companies; November added a hackathon honourable mention, and there are two open-source projects.

works:
  surprice:
    title: SurPrice
    seoDescription: "SurPrice finds deals across supermarkets, hypermarkets, drugstores and convenience stores in Taiwan, right in the browser. Ju-Shen Huang is lead developer."
    role: CTO · lead developer
    status: Live
    tagline: Supermarket deals across every chain, kept in your own deal book.
    summary: Every supermarket, pharmacy and hypermarket has its own flyer, and comparing them means leafing through each one. SurPrice puts the deals from all of them on one page, works out the unit price, marks how many days are left, and before you head out shows which nearby store honours them.
    outcomes:
      - value: Every chain
        label: Supermarkets, hypermarkets, pharmacies and convenience stores together
      - value: No install
        label: Opens in a phone browser
      - value: '{awards}'
        label: Competition awards
    highlights:
      - title: Every flyer on one page
        text: No more leafing through flyers one by one. This week’s deals from every chain sit together, sorted by ending soon, nearest, lowest price or biggest discount, and you can search by product or brand. Comparing prices in bed at night? The page follows your phone into dark mode.
      - title: The maths done for you
        text: '“Buy one get one” and “two for” prices are the hardest to compare. Every deal is turned into an average price and a unit price (per 100 ml, say), with the days left beside it and a link to the flyer it came from, so you can check.'
      - title: Only the stores you go to
        text: Pick the chains you shop at and the home page, the swipe deck and the nearby map keep only their deals, with a count for each.
      - title: Filter by category and chain
        text: Food, drinks, personal care, pets, babies... filter by category and chain together, and see how many deals will be left before you tap.
      - title: Text too small? One tap
        text: Older shoppers compare prices too. “Large text” in the corner scales the whole screen, prices and days left included.
      - title: Swipe to save, then get directions
        text: Once signed in, flick through deals like cards and swipe right to keep one in your deal book, with the ones ending soonest first. Under “Nearby”, see which stores honour the deals you kept and get directions in one tap.
    myPart:
      - As Finctory’s CTO, led product development and wrote most of the code
      - Rebuilt the prototype as a real web app – search, swipe deck, saved deals and nearby stores
      - Turned flyers in every chain’s own format into deals you can search, sort and compare by unit price
    results:
      - metric: Competition awards
        value: '{awards}'
  taobao:
    title: Taobao Exchange
    seoDescription: "Taobao Exchange is a Chrome extension that shows New Taiwan dollar prices right next to RMB on Taobao and Tmall. Built solo by Ju-Shen Huang."
    role: Solo developer
    status: On the Chrome Web Store
    tagline: Shop Taobao and see NT$ right next to the price.
    summary: Shopping on Taobao and Tmall means multiplying every RMB price by the exchange rate yourself. With Taobao Exchange installed, prices on product pages, search results and the cart get their New Taiwan dollar figure right beside them, at a rate that updates itself every day.
    outcomes:
      - value: '278'
        label: Chrome Web Store users
        live: users
      - value: 4.8 stars
        label: From 5 ratings
        live: rating
      - value: No sign-in
        label: Everything is worked out in your browser
    highlights:
      - title: NT$, right next to the price
        text: On product pages, search results, the cart, favourites and your browsing history, every RMB price gets an NT$ tag beside it. Scroll, page or filter and the newly loaded prices are converted too.
      - title: A rate that updates itself
        text: Click the icon in the toolbar to see the rate in use and when it was last updated. Nothing to type in and nothing to set up.
      - title: No account, and hands off your data
        text: All conversion happens in your own browser. No account, and it neither reads nor stores your shopping history; it never runs on checkout or sign-in pages at all.
    myPart:
      - Built it alone from nothing to the store – price detection, daily rates, the popup and the welcome page
      - Made prices convert on Taobao’s ever-shifting pages, through infinite scroll and in-page navigation
      - Took it through Chrome Web Store review, and still maintain it
  osave:
    title: oSave
    seoDescription: "oSave is a budgeting app that scores your financial health, on iOS and Android. Built at Finctory; Ju-Shen Huang leads its architecture and backend."
    role: CTO · architecture and backend
    status: Live
    tagline: A budgeting app that answers “am I actually financially healthy?”
    summary: Most budgeting apps only tell you where the money went. oSave keeps your books with accounting logic, works out six financial-health indicators, gives you a score every month, and tells you what pulled it down.
    outcomes:
      - value: iOS + Android
        label: On both app stores
      - value: '{awards}'
        label: Competition awards
      - value: '{topPrizes}'
        label: Top prizes
      - value: U-Start
        label: Ministry of Education startup grant
    highlights:
      - title: Three taps per entry
        text: Pick whether money came in or went out and how you paid, type the item and amount; the category fills itself in. You never need to know accounting, yet every entry carries its accounting meaning.
      - title: The whole month on one page
        text: Income versus spending, where the money flowed and what it went on, side by side – you can see at a glance where it came from and where it went.
      - title: A score, and the reason for it
        text: Six indicators become a 0-100 score, with what needs work and what to keep, plus one sentence on what to adjust next month.
      - title: A heads-up when spending looks off
        text: It compares this month with your usual habits; when one category suddenly jumps, it flags it and lists the entries behind it.
      - title: A savings goal you can watch
        text: Set an amount and a deadline; the progress bar moves with every entry and estimates the day you will get there.
      - title: This week against last, this month against last
        text: Switch between week and month and the difference in income and spending is drawn as bars, with no digging through records.
    turn:
      title: From Invoice Doctor to oSave
      text: The first version, Invoice Doctor, read your receipts and sorted your spending automatically. The data was all there, yet people still could not answer “is this month better or worse?”. In May 2025 we changed course – instead of collecting more data, make every entry add up to a conclusion.
    myPart:
      - As CTO, led the development team from Invoice Doctor all the way to oSave’s launch
      - Designed the system architecture and wrote the backend and the financial-indicator calculations
      - Built automatic item categorisation – rules first, AI only when rules miss, and a failed guess never blocks an entry
    results:
      - metric: Available on
        value: iOS + Android
      - metric: Competition awards
        value: '{awards}'
  phishforge:
    title: PhishForge
    seoDescription: "PhishForge has AI write phishing emails tailored to each department, then reports who opened, clicked and submitted. Ju-Shen Huang built backend and AI."
    role: Backend · AI engineering
    status: Concluded
    tagline: AI-written phishing you cannot tell from the real thing – so security drills actually teach something.
    summary: Template drills get recognised after a few rounds; staff learn to spot the company’s test mail, not phishing. PhishForge has AI write tailored phishing mail and matching fake login pages for each department and situation, then shows the company how many people opened, clicked and filled in the form.
    outcomes:
      - value: 1st place
        label: Information Application Service Innovation Contest, security track
      - value: No passwords kept
        label: Behaviour is recorded, what people type is not
    highlights:
      - title: A drill in a few steps
        text: Enter the company name, department structure and recent context to start – no real personal data about staff needed.
      - title: AI writes, you approve
        text: The AI writes mail and sender personas tailored to the scenario, and a rule check stops it producing material that could be used in a real attack.
      - title: Behaviour, not passwords
        text: Only opens, clicks, form submissions and time taken are recorded; nothing anyone types is stored. Every drill runs in its own container and is destroyed afterwards.
    myPart:
      - Backend and AI engineering – FastAPI backend, PostgreSQL and Redis for data and live statistics
      - Chained Gemini through LangChain to generate tailored phishing mail and matching fake login pages
      - Deployed every drill as its own AWS ECS task, destroyed when the drill ends
    results:
      - metric: 29th Information Application Service Innovation Contest
        value: Security track, 1st place
      - metric: NSTC undergraduate research grant
        value: Awarded 2024, completed
  catalyst:
    title: Catalyst
    seoDescription: "Catalyst won 1st place at TSMC IT CareerHack 2025: AI agents fix or convert code, test it in a container and deploy it. Ju-Shen Huang designed the UI."
    role: UI design
    status: Competition entry
    tagline: Hand it code that needs changing – a team of AI agents fixes it, tests it and ships it.
    summary: "The brief for this track, “AI Ops toolkit”: take a piece of code and move it to a new version or language, speed it up, or fix its compile and runtime errors – then deploy it through CI/CD. Catalyst passes the job along a team of AI agents with one task each: pin down the request and plan, write the code, compile and run it in a container, generate and run tests, then deploy."
    outcomes:
      - value: 1st place
        label: TSMC IT CareerHack, AI Ops track
      - value: 4 teams
        label: Code, compile and run, test, deploy – each its own group of agents
      - value: Up to 3 rewrites
        label: A deployment config that fails its check goes back to be rewritten
    highlights:
      - title: Ask first, then build
        text: A task-analysis agent first clarifies the problem and reads the code’s context, turns the request into a step-by-step plan, and only then hands it to the team responsible. Nothing starts on a guess.
      - title: Every step in view
        alt: Catalyst mid-run – the five stages on the left stopped at Compile Environment, finished agents in the middle, and the terminal on the right explaining the code change
        text: The stages on the left, the agents at work in the middle, their conversation on the right. Where the run is, and why a change was made, is all on screen.
      - title: Actually run in a container
        text: The changed code is compiled and run in a Docker container, test cases are generated and run against it, and an analysis agent reads the result. Anything wrong goes back to be fixed.
      - title: Deployed, with the address
        text: It writes a requirements spec and a deployment plan, generates the deployment config from reference docs, and rewrites it up to three times if it fails the check. When the deploy succeeds, the address is right there on screen.
    turn:
      title: Why a team of small models
      text: One large model doing everything is expensive and prone to being confidently wrong; a team of large models uses even more tokens. Each of our agents does one job, so a small language model is enough – and every agent’s reply is checked before it goes to the next.
    myPart:
      - "UI design: the whole flow on screen, from uploading code and typing the request, through watching the agents hand off, to getting the deployed address"
      - Put the stages, the agents at work and their conversation on one screen, so anyone can see what each step is doing
  finctory:
    title: Finctory
    seoDescription: "Finctory is a student-founded fintech company in Taiwan behind oSave, SurPrice and Taobao Exchange. Ju-Shen Huang is a co-founder and the CTO."
    role: Co-founder · CTO
    status: Operating
    tagline: A fintech startup making every dollar count.
    highlightsTitle: Products
    summary: In April 2024 a few students formed a team; two years later it is a registered company with four product lines – oSave, SurPrice, Taobao Exchange and the oSave podcast. I am a co-founder and the CTO.
    outcomes:
      - value: '4'
        label: Product lines
      - value: NT$1M+
        label: Competition prizes and grants
    highlights:
      - title: oSave
        text: A budgeting app built on accounting logic that scores your financial health, live on iOS and Android.
      - title: SurPrice
        text: A web app for deals across chains – every flyer’s offers on one page, each worked out to a unit price and the days left.
      - title: Taobao Exchange
        text: A Chrome extension that shows Taobao’s RMB prices in New Taiwan dollars, automatically.
      - title: oSave Podcast
        text: oSave’s own show about budgeting and money, on air since November 2025 on Apple Podcasts and other platforms.
    turn:
      title: Making the system outlive its authors
      text: In a team with no investors, where everyone is still a student and anyone can leave, the first question before writing code is “can the next person take this over?”. So all four product lines share the same rules for deploying, testing and documenting, while each front end uses whatever suits its platform – and no one leaving takes a whole product with them.
    myPart:
      - CTO since the team formed, leading an engineering team of four or fewer
      - Set the deployment, testing and documentation rules all four product lines share, so handovers hold
      - Led oSave’s system architecture and backend
    results:
      - metric: Incorporation
        value: Registered company
      - metric: Product lines
        value: '4'
  medalink:
    title: MedaLink
    seoDescription: "MedaLink is an AI front desk for clinics: four messaging channels in one inbox, replies, scheduling and follow-ups. Co-founded and built by Ju-Shen Huang."
    role: Co-founder · Forward-Deployed Engineer
    status: Live
    tagline: An AI front desk for clinics – replies, scheduling and recalls in one system.
    summary: Messages from LINE, Facebook, Instagram and the website land in one inbox. The AI answers by each clinic’s own rules, books people into slots where the doctor, room and equipment are all free, then takes over reminders, rescheduling, aftercare and six-month recalls.
    outcomes:
      - value: 2 people
        label: Requirements to production
      - value: 4 channels
        label: Messages in one inbox
    highlights:
      - title: Only bookable slots are offered
        text: A treatment is split into stages, and a slot only appears when every doctor, assistant, room and machine each stage needs is free. The front desk stops phoning people to fix bad bookings.
      - title: Every patient’s stage at a glance
        text: Bookings create a record automatically and move through a seven-stage pipeline; reminders, rescheduling, waitlist fills, aftercare and six-month recalls can each be switched on or off.
      - title: What must not be said never is
        text: Promises of results, comparative claims and post-treatment symptom advice are on a do-not-answer list – the AI stops and alerts the front desk. Wound and medical photos always go to a human.
    turn:
      title: More than auto-replies
      text: A front desk can answer messages for about 176 hours a month; for the other 544, messages keep arriving. But auto-replies are not enough – once the question is answered, the person has to be booked into a slot that really works, followed by reminders, changes and recalls. MedaLink connects that whole chain.
    myPart:
      - The AI half of a two-person team, from the conversation engine to cloud deployment
      - Made the AI answer by each clinic’s own playbook, knowledge base and do-not-answer list, in the clinic’s own voice
      - Routed messages to different models by difficulty, so simple greetings use a cheaper model and save the clinic money
    results:
      - metric: Team
        value: 2 people, requirements to production
      - metric: Status
        value: Live, running in clinics daily

