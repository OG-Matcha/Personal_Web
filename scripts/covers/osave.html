<!doctype html>
<meta charset="utf-8" />
<title>oSave cover</title>
<link rel="stylesheet" href="../../public/fonts/latin.css" />
<link rel="stylesheet" href="../../public/fonts/cjk.css" />
<style>
  /* Designed at exactly the size it is exported at. The card crops this to
     16:9 and the lead card to 21:9, both centred, so nothing that matters is
     allowed within 90px of the top or bottom edge. */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1600px;
    height: 900px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 720px;
    align-items: center;
    gap: 40px;
    padding: 90px 0 90px 96px;
    background: #eef2f8;
    font-family: 'IBM Plex Sans', 'Noto Sans TC', sans-serif;
    color: #0b1220;
  }

  /* The product's blue, not the site's lime: the covers sit inside cards that
     already carry the site's frame, and four case studies in one accent would
     make them read as one project. */
  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    letter-spacing: 0.22em;
    color: #2563d8;
  }

  h1 {
    margin-top: 26px;
    font-family: 'Archivo', 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 96px;
    line-height: 1.02;
    letter-spacing: -0.01em;
  }

  .lede {
    margin-top: 28px;
    max-width: 20em;
    font-size: 27px;
    line-height: 1.62;
    color: #46536b;
  }

  /* The three-step spine of the case study, stated as the thing it is: the
     front asks little, the back does the accounting. */
  .flow {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 46px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 21px;
  }

  .step {
    padding: 9px 18px;
    border: 1px solid #c3cede;
    border-radius: 999px;
    background: #fff;
    white-space: nowrap;
  }

  .step b {
    color: #2563d8;
    font-weight: 600;
  }

  .arrow {
    color: #9aa8bf;
  }

  .shots {
    position: relative;
    height: 720px;
  }

  .shots img {
    position: absolute;
    width: 348px;
    border-radius: 26px;
    border: 1px solid #d4dce9;
    box-shadow: 0 40px 80px -34px rgb(11 18 32 / 0.45);
    background: #fff;
  }

  .shots img.a {
    top: 0;
    left: 0;
  }

  .shots img.b {
    top: 74px;
    left: 330px;
  }
</style>

<div>
  <p class="kicker">FINCTORY / CASE 01</p>
  <h1>財伴 oSave</h1>
  <p class="lede">記錄本身沒有結論。要有結論，每一筆就得帶著會計上的意義。</p>

  <div class="flow">
    <span class="step">前台問 <b>3</b> 個問題</span>
    <span class="arrow">→</span>
    <span class="step"><b>13</b> 項金流方向</span>
    <span class="arrow">→</span>
    <span class="step"><b>6</b> 項健康指標</span>
  </div>
</div>

<div class="shots">
  <img class="a" src="../../public/images/osave-2.webp" alt="" />
  <img class="b" src="../../public/images/osave-3.webp" alt="" />
</div>
