# https://github.com/actions/deploy-pages#usage
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - master
jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Only what removing old deployments needs; write-all also handed this
    # third-party action the repository contents, issues and packages.
    permissions:
      deployments: write

    steps:
      - name: 🗑 Delete deployment
        uses: strumwolf/delete-deployment-environment@195215d2c5602aee6fb4b9cf0853970decca9e7a # v2 (pinned: a moved tag cannot change what runs with the token)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: github_pages
          onlyRemoveDeployments: true
  build:
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The same npm as the machine the lock file is written on (npm 10 reads
      # it differently and `npm ci` refuses it); budoux also needs Node 22.
      - run: npm install -g npm@11.6.2
      # 移除此處的 .nojekyll 創建（將在構建後創建）
      # Exactly the locked versions; `npm install` could pull a newer one (vue is "latest").
      - run: npm ci
      # 中文標題的斷詞表（BudouX），依目前內容重算，內容改了也不會過期
      - run: node scripts/make-keep.mjs
      # 內容裡的每個中文字都要在網頁字型子集裡，少了就停下來（不然會用系統字型畫出來）
      - run: node scripts/check-fonts.mjs
      - run: npx nuxt build --preset github_pages
        env:
          NUXT_APP_BASE_URL: '/' # 用戶站點使用 '/'，項目站點使用 '/repository-name/'
      # 在構建完成後創建 .nojekyll 文件
      - name: Create .nojekyll file
        run: |
          touch .output/public/.nojekyll
          ls -la .output/public/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public
  # Deployment job
  deploy:
    # Add a dependency to the build job
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    # Deploy to the github_pages environment
    environment:
      name: github_pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
